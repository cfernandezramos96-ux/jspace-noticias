# JSpace · Telegram: escucha el bot (GitHub Actions; el repo es público, así que los minutos no se acaban). Cada
# ejecución dura ~4,5 min en bucle con long polling, así el bot contesta en segundos; el cron la relanza cada 5 min
# (con atrasos) y se relanza ella misma al terminar, a cualquier hora: así el bot queda escuchando sin que nadie lo lance a mano.
# En cada vuelta: git pull → scripts/telegram.mjs (mensajes, botones, previews y resultados) → commit y push → si llegó
# trabajo nuevo, despierta la rutina «JSpace · Telegram» de la nube (disparador API), que arma el post y deja el
# preview (<id>.preview.json) o la respuesta (<id>.resultado.txt); la siguiente vuelta los manda.
# Secretos del repositorio (Settings → Secrets and variables → Actions): TELEGRAM_TOKEN, TELEGRAM_CHAT_ID,
# RUTINA_TOKEN (el token del disparador API de la rutina; la URL va fija abajo).
name: JSpace Telegram
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push: # un cambio al bot lo arranca al momento
    paths: ['.github/workflows/telegram.yml', 'scripts/telegram.mjs']
concurrency: telegram
permissions:
  contents: write
  actions: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Escuchar el bot y relanzar
        # 5 nov 2026: dos caídas de GitHub dejaron al bot apagado ~20 min porque no se pudo relanzar. Ahora, si el
        # relanzamiento falla, el bot sigue escuchando otra vuelta y vuelve a intentar, hasta ~25 min; así no se apaga
        # mientras GitHub se recupera. Un push o un despertar que falla tampoco tumban la vuelta: se reintentan después.
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUTINA_TOKEN: ${{ secrets.RUTINA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ESPERA: '10'
          DESPERTAR: ${{ runner.temp }}/despertar
        run: |
          git config user.name "JSpace Bot"
          git config user.email "jspace-bot@users.noreply.github.com"
          escucha() {
            fin=$((SECONDS + 270))
            while [ $SECONDS -lt $fin ]; do
              git pull -q --rebase || git rebase --abort 2>/dev/null || true
              node scripts/telegram.mjs || sleep 10
              node scripts/semana.mjs || true
              git add noticias docs/semana
              git diff --cached --quiet || git commit -q -m "Telegram: entrada" || true
              git push -q 2>/dev/null || (git pull -q --rebase && git push -q) || echo "push falló, se reintenta en la próxima vuelta"
              if [ -s "$DESPERTAR" ]; then
                if curl -sS --fail-with-body -X POST https://api.anthropic.com/v1/claude_code/routines/trig_01VSHZEWR9XsE2NfbMkPkUnE/fire                   -H "Authorization: Bearer $RUTINA_TOKEN"                   -H "anthropic-beta: experimental-cc-routine-2026-04-01"                   -H "anthropic-version: 2023-06-01"                   -H "content-type: application/json"                   -d '{"text": "Llegaron pedidos nuevos del bot de Telegram en noticias/entrada/."}' > /dev/null; then
                  echo "rutina despertada"; rm -f "$DESPERTAR"
                else echo "no se pudo despertar la rutina, se reintenta"; fi
              fi
            done
            # 9 nov 2026: lo que no alcanzó a subir se perdería al acabar y la vuelta siguiente lo mandaría otra vez
            for i in 1 2 3 4 5; do
              git push -q && return 0
              git pull -q --rebase -X theirs || git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "no pude subir el estado al terminar la vuelta"
          }
          relanza() {
            # siempre, también de madrugada: el equipo le escribe a cualquier hora (Kazuo, 4 nov 2026)
            for i in 1 2 3; do
              gh workflow run telegram.yml --ref main && { echo "relanzado"; return 0; }
              echo "no se pudo relanzar (intento $i)"; sleep $((i * 10))
            done
            return 1
          }
          escucha
          for ronda in 1 2 3 4; do
            relanza && exit 0
            echo "GitHub no deja relanzar: sigo escuchando otra vuelta (ronda $ronda)"
            escucha
          done
          relanza
