# JSpace · Telegram: revisa el bot cada 5 minutos (GitHub Actions, gratis) y guarda en noticias/entrada/ los links que
# llegan. Si llegó algo, despierta la rutina «JSpace · Telegram» de la nube (disparador API), que arma el post y deja la
# respuesta en noticias/entrada/<id>.resultado.txt; ese push vuelve a correr esto y el bot la manda.
# Secretos del repositorio (Settings → Secrets and variables → Actions): TELEGRAM_TOKEN, TELEGRAM_CHAT_ID,
# RUTINA_URL y RUTINA_TOKEN (la URL y el token del disparador API de la rutina).
name: JSpace Telegram
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['noticias/entrada/*.resultado.txt']
concurrency: telegram
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: bot
        run: node scripts/telegram.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar cambios
        run: |
          git config user.name "JSpace Bot"
          git config user.email "jspace-bot@users.noreply.github.com"
          git add noticias/entrada
          git diff --cached --quiet || (git commit -m "Telegram: entrada" && (git push || (git pull --rebase && git push)))
      - name: Despertar la rutina
        if: steps.bot.outputs.nuevas != '0' && steps.bot.outputs.nuevas != ''
        env:
          RUTINA_URL: ${{ secrets.RUTINA_URL }}
          RUTINA_TOKEN: ${{ secrets.RUTINA_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST "$RUTINA_URL" \
            -H "Authorization: Bearer $RUTINA_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"text": "Llegaron pedidos nuevos del bot de Telegram en noticias/entrada/."}' > /dev/null
          echo "rutina despertada"
