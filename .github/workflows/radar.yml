# JSpace · radar de noticias: cada 2 horas lee RSS y avisa al grupo si salió algo grande de los nombres que le
# funcionan a la cuenta o de Colombia (scripts/radar.mjs). Gratis: no usa Claude; Claude solo trabaja si alguien del
# grupo toca «Ármalo».
name: JSpace radar
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/radar.yml', 'scripts/radar.mjs', 'noticias/radar.json']
concurrency: radar
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Revisar fuentes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/radar.mjs
          git config user.name "JSpace Bot"; git config user.email "jspace-bot@users.noreply.github.com"
          git add noticias/entrada/radar.json
          git diff --cached --quiet || (git commit -q -m "Radar" && (git push -q || (git pull -q --rebase && git push -q)))
