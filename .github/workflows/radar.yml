# JSpace · radar de noticias: cada 2 horas lee RSS y avisa al grupo si salió algo grande de los nombres que le
# funcionan a la cuenta o de Colombia (scripts/radar.mjs). Gratis: no usa Claude; Claude solo trabaja si alguien del
# grupo toca «Ármalo».
name: JSpace radar
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/radar.yml', 'scripts/radar.mjs', 'noticias/radar.json']
concurrency: radar
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Revisar fuentes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/radar.mjs
          git config user.name "JSpace Bot"; git config user.email "jspace-bot@users.noreply.github.com"
          git add noticias/entrada/radar.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar"
          # 5 nov 2026: una caída de GitHub tumbó el push; se reintenta para no perder lo ya avisado (y no avisar doble)
          for i in 1 2 3 4 5; do git push -q && exit 0; sleep $((i * 15)); git pull -q --rebase || true; done
          exit 1
