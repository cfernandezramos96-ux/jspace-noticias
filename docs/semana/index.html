<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSpace · Horario semanal</title>
<link rel="icon" href="../icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #0a0a0a; --panel: #141414; --panel2: #1c1c1c; --linea: #2a2a2a; --texto: #f2f2f2; --suave: #9a9a9a;
    --rojo: #ff3636; --verde: #3ecf6e; --azul: #4ea1ff; --ambar: #ffb020; --gris: #6b6b6b; --morado: #b78cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 500 14px/1.4 Poppins, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(10,10,10,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); }
  .barra { max-width: 1500px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca img { height: 30px; }
  .marca h1 { margin: 0; font: 900 18px Poppins; letter-spacing: .02em; text-transform: uppercase; }
  .nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nav button { background: var(--panel2); color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 7px 12px; font: 700 13px Poppins; cursor: pointer; }
  .nav button:hover { border-color: var(--rojo); }
  .nav .rango { font-weight: 700; min-width: 190px; text-align: center; }
  .resumen { max-width: 1500px; margin: 0 auto; padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 700 12px Poppins; background: var(--panel2); border: 1px solid var(--linea); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  .semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .dia { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; min-height: 240px; display: flex; flex-direction: column; }
  .dia.hoy { border-color: var(--rojo); box-shadow: 0 0 0 1px var(--rojo) inset; }
  .dia h2 { margin: 0; padding: 10px 12px; font: 900 13px Poppins; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; }
  .dia h2 span { color: var(--suave); font-weight: 700; }
  .dia.hoy h2 { color: var(--rojo); }
  .lista { padding: 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .post { background: var(--panel2); border: 1px solid var(--linea); border-left: 4px solid var(--gris); border-radius: 10px; overflow: hidden; }
  .post.publicado { border-left-color: var(--verde); }
  .post.aprobado { border-left-color: var(--azul); }
  .post.pendiente { border-left-color: var(--ambar); }
  .post.vencido, .post.error { border-left-color: var(--rojo); }
  .post.descartado { opacity: .5; }
  .post.externo { border-left-color: var(--morado); }
  .post { display: grid; grid-template-columns: 64px 1fr; }
  .post img { width: 64px; height: 80px; object-fit: cover; display: block; background: #000; margin: 8px 0 8px 8px; border-radius: 6px; }
  .post.sin-img { grid-template-columns: 1fr; }
  /* con las 7 columnas cada día es angosto: la portada va arriba, como franja, y el estado debajo de la hora */
  @media (min-width: 1101px) {
    .post { display: block; }
    .post img { width: 100%; height: 110px; margin: 0; border-radius: 0; object-position: 50% 20%; }
    .fila { flex-direction: column; align-items: flex-start; gap: 4px; }
  }
  .info { padding: 8px 10px 10px; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .hora { font: 900 15px Poppins; }
  .estado { font: 700 11px Poppins; padding: 2px 8px; border-radius: 999px; background: var(--fondo); white-space: nowrap; }
  .titular { margin: 6px 0 6px; font-weight: 700; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font: 700 10px Poppins; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; background: var(--fondo); color: var(--suave); }
  .tag.r { color: var(--rojo); }
  .links { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; font: 700 12px Poppins; }
  .links a { color: var(--texto); text-decoration: none; border-bottom: 1px solid var(--rojo); }
  .hueco { border: 1px dashed var(--linea); border-radius: 10px; padding: 10px; color: var(--suave); font-size: 12px; }
  .hueco b { color: var(--texto); font-weight: 900; }
  .hueco.tarde { border-color: rgba(255,54,54,.5); color: #ff8a8a; }
  footer { max-width: 1500px; margin: 0 auto; padding: 0 16px 30px; color: var(--suave); font-size: 12px; }
  @media (max-width: 1100px) { .semana { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    header { position: static; }
    .dia { min-height: 0; }
    .semana { grid-template-columns: 1fr; }
    .nav { margin-left: 0; width: 100%; justify-content: space-between; }
    .nav .rango { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
<header>
  <div class="barra">
    <div class="marca"><img src="../jspace-logo.svg" alt="JSpace"><h1>Horario semanal</h1></div>
    <div class="nav">
      <button id="antes" aria-label="Semana anterior">←</button>
      <div class="rango" id="rango"></div>
      <button id="despues" aria-label="Semana siguiente">→</button>
      <button id="hoy">Hoy</button>
    </div>
  </div>
  <div class="resumen" id="resumen"></div>
</header>
<main><div class="semana" id="semana"></div></main>
<footer id="pie"></footer>
<script>
const REPO = 'https://raw.githubusercontent.com/cfernandezramos96-ux/jspace-noticias/main/';
const TZ = 'America/Bogota';
const ESTADOS = {
  publicado: ['Publicado', 'var(--verde)'], aprobado: ['Aprobado', 'var(--azul)'], pendiente: ['Sin aprobar', 'var(--ambar)'],
  vencido: ['No salió (sin aprobar)', 'var(--rojo)'], error: ['Error al publicar', 'var(--rojo)'],
  manual: ['A mano 🎵', 'var(--gris)'], descartado: ['Descartado', 'var(--gris)'], externo: ['Collab', 'var(--morado)'],
};
const FRANJAS = { jmusic: 'J-music', anime: 'Anime', extra: 'Extra' };
// los dos automáticos de cada día: si falta alguno, se ve el hueco
const FIJOS = [['12:30', 'jmusic', 'J-music'], ['18:30', 'anime', 'Anime']];
const INICIO = '2026-11-04';
const diaDe = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d); // AAAA-MM-DD en Bogotá
const horaDe = (d) => new Intl.DateTimeFormat('es-CO', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(d);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let datos = { posts: [] }, lunes = lunesDe(new Date());

function lunesDe(fecha) {
  const d = new Date(diaDe(fecha) + 'T12:00:00Z'); // mediodía UTC del día de Bogotá
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d;
}
async function carga() {
  // en GitHub Pages lee el datos.json recién subido (raw, sin esperar a que Pages despliegue); en local, el del disco
  const urls = [REPO + 'docs/semana/datos.json?t=' + Date.now(), 'datos.json?t=' + Date.now()];
  if (location.hostname === 'localhost') urls.reverse();
  for (const url of urls) {
    try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) { datos = await r.json(); return pinta(); } } catch {}
  }
  document.getElementById('semana').innerHTML = '<p>No pude cargar los datos.</p>';
}
function tarjeta(p) {
  const [nombre, color] = ESTADOS[p.estado] || [p.estado, 'var(--gris)'];
  const temas = (p.temas || []).filter((t) => t === 'anime' || t === 'jmusic');
  const tags = [p.externo ? 'Desde ' + p.cuenta : FRANJAS[p.franja] || p.franja,
    temas.length > 1 ? 'Anime + J-music' : null, p.video && 'Video', ...(p.colaboradores || []).map((c) => 'Collab ' + c)].filter(Boolean);
  const links = [p.ig && `<a href="${esc(p.ig)}" target="_blank" rel="noopener">Instagram</a>`,
    p.fb && `<a href="${esc(p.fb)}" target="_blank" rel="noopener">Facebook${p.fb_tipo === 'reel' ? ' (reel)' : ''}</a>`].filter(Boolean);
  const extras = [p.reel_prueba && 'Reel de prueba', p.historia && 'Historia'].filter(Boolean);
  return `<article class="post ${p.estado}${p.portada ? '' : ' sin-img'}">
    ${p.portada ? `<img src="${REPO + esc(p.portada)}" alt="">` : ''}
    <div class="info">
      <div class="fila"><span class="hora">${horaDe(new Date(p.hora))}</span><span class="estado" style="color:${color}">${nombre}</span></div>
      <div class="titular">${esc(p.titular)}</div>
      <div class="tags">${tags.map((t) => `<span class="tag${t === 'Video' ? ' r' : ''}">${esc(t)}</span>`).join('')}${extras.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
      ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
    </div></article>`;
}
function pinta() {
  const dias = [...Array(7)].map((_, i) => { const d = new Date(lunes); d.setUTCDate(d.getUTCDate() + i); return d; });
  const claves = dias.map((d) => d.toISOString().slice(0, 10)), hoy = diaDe(new Date());
  const fmt = (d, o) => new Intl.DateTimeFormat('es-CO', { timeZone: 'UTC', ...o }).format(d);
  document.getElementById('rango').textContent = `${fmt(dias[0], { day: 'numeric', month: 'short' })} – ${fmt(dias[6], { day: 'numeric', month: 'short', year: 'numeric' })}`;
  const deLaSemana = datos.posts.filter((p) => claves.includes(diaDe(new Date(p.hora))));
  const cuenta = (e) => deLaSemana.filter((p) => p.estado === e).length;
  let huecos = 0;
  document.getElementById('semana').innerHTML = dias.map((d, i) => {
    const clave = claves[i], posts = deLaSemana.filter((p) => diaDe(new Date(p.hora)) === clave);
    const vivos = posts.filter((p) => !['descartado', 'vencido', 'manual'].includes(p.estado));
    // un automático cuenta como hecho si hay un post de su franja ese día o uno cerca de su hora (±45 min); los huecos
    // se marcan desde que empezaron los dos automáticos con aprobación (4 nov 2026)
    const cerca = (h) => vivos.some((p) => !p.externo && Math.abs(new Date(p.hora) - new Date(`${clave}T${h}:00-05:00`)) < 45 * 60e3);
    const faltan = clave < INICIO ? [] : FIJOS.filter(([h, f]) => !vivos.some((p) => !p.externo && p.franja === f) && !cerca(h)).map(([h, f, n]) => {
      const pasado = clave < hoy || (clave === hoy && new Date() > new Date(`${clave}T${h}:00-05:00`));
      if (!pasado) huecos++;
      return { hora: new Date(`${clave}T${h}:00-05:00`), html: `<div class="hueco${pasado ? ' tarde' : ''}"><b>${h}</b> · ${n}: ${pasado ? 'no salió' : 'se arma a las 8:00'}</div>` };
    });
    const items = [...posts.map((p) => ({ hora: new Date(p.hora), html: tarjeta(p) })), ...faltan].sort((a, b) => a.hora - b.hora);
    return `<section class="dia${clave === hoy ? ' hoy' : ''}"><h2>${fmt(d, { weekday: 'long' })}<span>${fmt(d, { day: 'numeric', month: 'short' })}</span></h2>
      <div class="lista">${items.map((x) => x.html).join('')}</div></section>`;
  }).join('');
  const chip = (n, t, c) => `<span class="chip"><i style="background:${c}"></i>${n} ${t}</span>`;
  document.getElementById('resumen').innerHTML = chip(cuenta('publicado'), 'publicados', 'var(--verde)') + chip(cuenta('aprobado'), 'aprobados', 'var(--azul)') +
    chip(cuenta('externo'), 'collabs de otras cuentas', 'var(--morado)') + chip(cuenta('pendiente'), 'sin aprobar', 'var(--ambar)') + chip(cuenta('vencido') + cuenta('error'), 'no salieron', 'var(--rojo)') +
    chip(huecos, 'automáticos por armar', 'var(--gris)');
  document.getElementById('pie').textContent = datos.actualizado ? `Actualizado: ${new Intl.DateTimeFormat('es-CO', { timeZone: TZ, dateStyle: 'medium', timeStyle: 'short' }).format(new Date(datos.actualizado))} (hora de Bogotá). Se refresca sola cada 2 minutos.` : '';
}
const mueve = (n) => { lunes.setUTCDate(lunes.getUTCDate() + 7 * n); pinta(); };
document.getElementById('antes').onclick = () => mueve(-1);
document.getElementById('despues').onclick = () => mueve(1);
document.getElementById('hoy').onclick = () => { lunes = lunesDe(new Date()); pinta(); };
// en el celular la semana va en una columna: al abrir, salta al día de hoy
let primera = true;
const _pinta = pinta;
pinta = function () { _pinta(); if (primera && innerWidth <= 640) { primera = false; document.querySelector('.dia.hoy')?.scrollIntoView(); } };
carga(); setInterval(carga, 120000);
</script>
</body>
</html>
